version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maars-lens-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite+aiosqlite:///./maars_lens.db
      - OCR_ENGINE=paddleocr
      - ASYNC_OCR_ENABLED=False
      - SUPABASE_JWT_SECRET=production_demo_secret_key_32_characters_minimum
      - CORS_ORIGINS=["http://localhost", "http://localhost:3000", "http://localhost:5173"]
    volumes:
      - backend_data:/app/uploads
      - backend_db:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maars-lens-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  backend_db:
